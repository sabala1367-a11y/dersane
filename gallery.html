<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dersane Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap">
<style>
  /* Layout: navy hero with search card overlapping, sticky gold-ruled chip bar, two-column photo grid */
  :root {
    --navy: #0b2a5b;
    --navy-deep: #071c40;
    --gold: #f5c518;
    --bg: #eef3f9;
    --card: #ffffff;
    --fg: #0b2a5b;
    --muted: #5d6f8c;
    --line: #d5deea;
    --chip-bg: #ffffff;
    --chip-active-bg: #0b2a5b;
    --chip-active-fg: #ffffff;
    --soft: #e6eef9;
    --shadow: 0 6px 18px rgba(11, 42, 91, 0.10);
    --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
    --font-body: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1426;
      --card: #101f3a;
      --fg: #e8eefb;
      --muted: #9db0cf;
      --line: #223556;
      --chip-bg: #101f3a;
      --chip-active-bg: #f5c518;
      --chip-active-fg: #071c40;
      --soft: #17294a;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1426;
    --card: #101f3a;
    --fg: #e8eefb;
    --muted: #9db0cf;
    --line: #223556;
    --chip-bg: #101f3a;
    --chip-active-bg: #f5c518;
    --chip-active-fg: #071c40;
    --soft: #17294a;
    --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.4;
  }
  button { font-family: inherit; }

  .page { width: 100%; margin: 0; }

  .chip:focus-visible, .card:focus-visible, .lb-close:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  /* Hero */
  .hero {
    position: relative;
    padding: 36px clamp(16px, 4vw, 48px) 74px;
    color: #ffffff;
    background:
      radial-gradient(120% 90% at 85% 0%, rgba(80, 130, 220, 0.35), transparent 60%),
      linear-gradient(180deg, #0c2f66 0%, #071c40 100%);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid rgba(245, 197, 24, 0.6);
    background: rgba(245, 197, 24, 0.12);
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .hero h1 {
    margin: 14px 0 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(34px, 9vw, 52px);
    line-height: 1.1;
    text-wrap: balance;
  }
  .hero h1 em { color: var(--gold); font-weight: 600; }

  /* Search card overlaps the hero edge */
  .search-wrap { padding: 0 clamp(16px, 4vw, 48px); margin-top: -34px; position: relative; z-index: 2; }
  .search {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px 12px 18px;
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .search svg { flex: none; color: var(--navy); }
  :root[data-theme="dark"] .search svg { color: var(--gold); }
  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
    padding: 8px 0;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus, .search input:focus-visible { outline: none; }
  .search:focus-within {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(245, 197, 24, 0.4), 0 16px 32px rgba(11, 42, 91, 0.22);
  }
  .search:focus-within svg { transform: scale(1.18) rotate(-14deg); }
  .search:focus-within .count { background: var(--gold); color: #071c40; }
  .count {
    flex: none;
    padding: 9px 14px;
    border-radius: 10px;
    background: var(--soft);
    color: var(--fg);
    font-weight: 600;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* Chips */
  .chips {
    display: flex;
    gap: 10px;
    padding: 18px clamp(16px, 4vw, 48px) 16px;
    margin-top: 20px;
    border-top: 3px solid var(--gold);
    background: var(--card);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--chip-bg);
    color: var(--fg);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--chip-active-bg);
    border-color: var(--chip-active-bg);
    color: var(--chip-active-fg);
  }
  .chip svg { color: var(--gold); }
  :root:not([data-theme="dark"]) .chip[aria-pressed="false"] svg { display: none; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    padding: 20px clamp(16px, 4vw, 48px) 36px;
  }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 900px)  { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1200px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  @media (min-width: 1400px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .card {
    position: relative;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .card .photo {
    position: relative;
    overflow: hidden;
    aspect-ratio: 4 / 3;
    background: var(--soft);
  }
  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tag {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 11px;
    border-radius: 8px;
    background: var(--navy-deep);
    color: var(--gold);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .card .cap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 14px 16px;
  }
  .card .cap h2 {
    margin: 0;
    min-width: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .cap svg { flex: none; color: var(--gold); }

  .empty {
    grid-column: 1 / -1;
    padding: 40px 12px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; margin-bottom: 4px; color: var(--fg); font-size: 17px; }

  /* Photo viewer */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(64px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .lb-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(5, 16, 38, 0.92);
    opacity: 0;
  }
  .lb.open .lb-backdrop { opacity: 1; }
  .lb-fig {
    position: relative;
    margin: 0;
    width: 100%;
    max-width: 560px;
    max-height: 100%;
    overflow: auto;
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .lb-fig img { display: block; width: 100%; height: auto; }
  .lb-fig figcaption {
    padding: 16px 18px 20px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    line-height: 1.3;
    color: var(--fg);
    text-wrap: balance;
  }
  .lb-close {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 14px;
    z-index: 2;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    .card {
      animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 70ms);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    }
    .card img { transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .card:active { transform: scale(0.96); }
    .card:active img { transform: scale(1.08); }
    @media (hover: hover) {
      .card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(11, 42, 91, 0.2); }
      .card:hover img { transform: scale(1.07); }
    }
    .chip {
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease,
        transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.25s ease;
    }
    .chip:active { transform: scale(0.93); }
    @media (hover: hover) {
      .chip[aria-pressed="false"]:hover {
        transform: translateY(-2px);
        border-color: var(--gold);
        box-shadow: 0 6px 14px rgba(11, 42, 91, 0.15);
      }
    }
    .chip[aria-pressed="true"] {
      animation: chipPop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
      box-shadow: 0 6px 16px rgba(11, 42, 91, 0.28);
    }
    .chip[aria-pressed="true"] svg { animation: boltFlash 0.6s ease; }
    @keyframes chipPop {
      0% { transform: scale(0.88); }
      60% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }
    @keyframes boltFlash {
      0% { transform: rotate(-25deg) scale(0.6); }
      50% { transform: rotate(12deg) scale(1.3); }
      100% { transform: rotate(0) scale(1); }
    }
    .search {
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .search svg { transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
    .count { transition: background 0.3s ease, color 0.3s ease; }
    .lb-backdrop { transition: opacity 0.3s ease; }
    .lb-fig { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
  }

  body { margin: 0; }
  img { max-width: 100%; }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <span class="badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h2l1.2-1.6A1 1 0 0 1 10 3h4a1 1 0 0 1 .8.4L16 5h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm8 2.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>
      Digital Archive
    </span>
    <h1>Dersane <em>Gallery</em></h1>
  </section>

  <div class="search-wrap">
    <label class="search" for="q">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search gallery by event or keyword..." autocomplete="off">
      <span class="count" id="count" aria-live="polite">0 Photos</span>
    </label>
  </div>

  <div class="chips" role="group" aria-label="Filter gallery">
    <button class="chip" type="button" data-filter="latest" aria-pressed="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      Latest Updates
    </button>
    <button class="chip" type="button" data-filter="all" aria-pressed="false">All Media</button>
  </div>

  <main class="grid" id="grid"></main>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-backdrop"></div>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close photo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <figure class="lb-fig" id="lbFig">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

    var list = PHOTOS.filter(function (p) {
      if (state.filter === "latest" && !p.recent) return false;
      return !q || p.title.toLowerCase().indexOf(q) !== -1;
    });
    current = list;
    count.textContent = list.length + (list.length === 1 ? " Photo" : " Photos");
    if (!list.length) {
      var msg = !loaded ? ["Loading photos...", ""]
        : failed ? ["Could not load photos", "Check your connection and try again."]
        : !PHOTOS.length ? ["No photos yet", "Photos added from the dashboard will appear here."]
        : (state.filter === "latest" && !q) ? ["No new updates", "Recent uploads appear here for a few days. Tap All Media to see earlier photos."]
        : ["No photos found", "Try a different event or keyword."];
      grid.innerHTML = '<div class="empty"><strong>' + msg[0] + '</strong>' + msg[1] + '</div>';
      return;
    }
    grid.innerHTML = list.map(function (p, i) {
      var tag = state.filter === "latest" ? '<span class="tag">Recent</span>' : "";
      return '<article class="card" tabindex="0" role="button" aria-label="Open photo: ' + esc(p.title) + '" data-i="' + i + '" style="--i:' + i + '"><div class="photo"><img src="' + p.src + '" alt="' + esc(p.title) + '" loading="lazy">' + tag + '</div>' +
        '<div class="cap"><h2 title="' + esc(p.title) + '">' + esc(p.title) + '</h2>' + BOLT + '</div></article>';
    }).join("");
  }

  function setFilter(f) {
    state.filter = f;
    document.querySelectorAll(".chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.dataset.filter === f ? "true" : "false");
    });
    render();
  }

  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () { setFilter(c.dataset.filter); });
  });
  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value;
    render();
  });

  /* Photo viewer: the card grows into a full photo with its caption below */
  var lb = document.getElementById("lb");
  var lbFig = document.getElementById("lbFig");
  var lbImg = document.getElementById("lbImg");
  var lbCap = document.getElementById("lbCap");
  var lastCard = null;
  var closing = false;
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function shiftTo(rect, fig) {
    var dx = rect.left + rect.width / 2 - (fig.left + fig.width / 2);
    var dy = rect.top + rect.height / 2 - (fig.top + fig.height / 2);
    var s = Math.min(rect.width / fig.width, 1);
    return "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
  }

  function openPhoto(card) {
    var p = current[Number(card.dataset.i)];
    if (!p || !lb.hidden) return;
    lastCard = card;
    lbImg.src = p.src;
    lbImg.alt = p.title;
    lbCap.textContent = p.title;
    var ready = lbImg.decode ? lbImg.decode().catch(function () {}) : Promise.resolve();
    ready.then(function () {
      lb.hidden = false;
      document.body.style.overflow = "hidden";
      if (!reduce) {
        var from = card.getBoundingClientRect();
        var to = lbFig.getBoundingClientRect();
        lbFig.style.transition = "none";
        lbFig.style.transform = shiftTo(from, to);
        void lbFig.offsetWidth;
        lbFig.style.transition = "";
        lbFig.style.transform = "";
      }
      lb.classList.add("open");
      document.getElementById("lbClose").focus({ preventScroll: true });
    });
  }

  function closePhoto() {
    if (lb.hidden || closing) return;
    closing = true;
    lb.classList.remove("open");
    var finish = function () {
      lb.hidden = true;
      lbFig.style.transform = "";
      document.body.style.overflow = "";
      closing = false;
      if (lastCard && document.body.contains(lastCard)) lastCard.focus({ preventScroll: true });
    };
    if (!reduce && lastCard && document.body.contains(lastCard)) {
      lbFig.style.transform = shiftTo(lastCard.getBoundingClientRect(), lbFig.getBoundingClientRect());
      setTimeout(finish, 380);
    } else {
      finish();
    }
  }

  grid.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (card) openPhoto(card);
  });
  grid.addEventListener("keydown", function (e) {
    var card = e.target.closest(".card");
    if (card && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      openPhoto(card);
    }
  });
  lb.addEventListener("click", function (e) {
    if (!e.target.closest("figcaption")) closePhoto();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePhoto();
  });

  function loadPhotos() {
    fetch("dashboard.php?list=1", { headers: { Accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (d) {
        PHOTOS = (d.photos || []).map(function (p) {
          return { title: p.title, src: p.url, recent: !!p.recent };
        });
        loaded = true; failed = false;
        if (state.filter === "latest" && PHOTOS.length && !PHOTOS.some(function (p) { return p.recent; })) { setFilter("all"); return; }
        render();
      })
      .catch(function () { loaded = true; failed = !PHOTOS.length; render(); });
  }

  render();
  loadPhotos();
</script>

</body>
</html>
