<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  :root { --accent: #1fc0da; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; }
  input, textarea, button { font-family: inherit; }

  /* ---------- Page ---------- */
  .page {
    position: relative; overflow: hidden; min-height: 100vh;
    background: linear-gradient(180deg, #0f1c2a 0%, #1b2f42 55%, #14232f 100%);
    color: #fff; padding: 72px 24px 80px;
    display: flex; flex-direction: column; align-items: center;
  }
  .skyline {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: .55; pointer-events: none; object-fit: cover; object-position: center;
  }
  .wrap {
    position: relative; width: 100%; max-width: 1100px;
    display: flex; flex-direction: column; align-items: center; gap: 56px;
  }
  .intro { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 640px; }
  .intro h1 { margin: 0; font-size: 42px; font-weight: 500; letter-spacing: .2px; }
  .intro p { margin: 0; font-size: 15px; line-height: 1.7; color: #dbe6ee; }

  .grid { width: 100%; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: space-between; }

  /* ---------- Contact info ---------- */
  .info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 32px; }
  .item { display: flex; gap: 20px; align-items: flex-start; }
  .icon {
    flex: none; width: 56px; height: 56px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .item h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; color: var(--accent); }
  .item p { margin: 0; font-size: 15px; line-height: 1.7; }

  /* ---------- Form card ---------- */
  .card {
    flex: 1 1 380px; min-width: 0; max-width: 350px; background: #fff; color: #1f2933;
    padding: 12px 24px 16px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  .card h2 { margin: 0 0 28px; font-size: 26px; font-weight: 500; color: #25303b; }
  form { display: flex; flex-direction: column; gap: 12px; }

  .field { position: relative; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5b6670; animation: rise .6s both; }
  .field:nth-child(2) { animation-delay: .1s; }
  .field:nth-child(3) { animation-delay: .2s; }
  .field:nth-child(4) { animation-delay: .3s; }
  .field input, .field textarea {
    border: 0; border-bottom: 2px solid #3a444d; border-radius: 0; background: transparent;
    padding: 8px 0; font-size: 16px; color: #1f2933; outline: none; transition: border-color .3s;
  }
  .field textarea { resize: vertical; }
  .field:hover input, .field:hover textarea { border-bottom-color: #00a6bf; }
  .field .line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, #1fc0da, #0089a0);
    transform: scaleX(0); transform-origin: left;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .field:focus-within .line { transform: scaleX(1); }
  .field .lbl { transition: color .3s, transform .3s; transform-origin: left; }
  .field:focus-within .lbl { color: #0089a0; transform: translateY(-1px); }
  .field input, .field textarea {
    transition: border-color .3s, background-color .35s, padding .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .field input:focus, .field textarea:focus {
    background-color: rgba(31,192,218,.08); padding-left: 10px; transform: translateX(4px);
    box-shadow: 0 6px 14px -8px rgba(0,137,160,.55);
  }
  @media (prefers-reduced-motion: reduce) {
    .field input, .field textarea { transition: none; }
    .field input:focus, .field textarea:focus { transform: none; }
  }

  /* ---------- Send button ---------- */
  .send {
    position: relative; overflow: hidden; align-self: flex-start; margin-top: 8px;
    min-height: 48px; min-width: 150px; padding: 0 40px; border: 0; border-radius: 999px;
    background: var(--accent); color: #06222b; font-size: 15px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .2s, box-shadow .25s;
  }
  .send::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: rgba(255,255,255,.5); transform: skewX(-20deg); transition: left .6s;
  }
  .send:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,166,191,.45); }
  .send:hover:not(:disabled)::after { left: 130%; }
  .send:active:not(:disabled) { transform: scale(.92); box-shadow: 0 2px 8px rgba(0,166,191,.4); transition-duration: .08s; }
  .send:focus-visible { outline: 3px solid #0b2a36; outline-offset: 2px; }
  .send:disabled { cursor: wait; animation: pulse 1s ease-in-out infinite; }
  .spin {
    display: none; flex: none; width: 16px; height: 16px;
    border: 2px solid rgba(6,34,43,.3); border-top-color: #06222b; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .send.loading .spin { display: inline-block; }

  /* ---------- Success message ---------- */
  .success { display: none; flex-direction: column; gap: 12px; padding: 24px 0 8px; }
  .success .title { margin: 0; font-size: 20px; font-weight: 500; color: #25303b; }
  .success .text { margin: 0; font-size: 15px; line-height: 1.7; color: #4a5560; }
  .card.sent form { display: none; }
  .card.sent .success { display: flex; }

  /* ---------- Error message (hidden when empty) ---------- */
  .err { margin: 0; font-size: 13.5px; color: #c9372c; }
  .err:empty { display: none; }

  /* ---------- Animations ---------- */
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes rise  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(31,192,218,.55); } 50% { box-shadow: 0 0 0 12px rgba(31,192,218,0); } }
  @media (prefers-reduced-motion: reduce) {
    .field, .field .line, .send, .send::after { animation: none; transition: none; }
    .spin { animation-duration: 1.8s; }
  }

  @media (max-width: 520px) {
    .page { padding: 56px 16px 64px; }
    .intro h1 { font-size: 34px; }
    .card { padding: 28px 22px 32px; }
  }
</style>
</head>
<body>
<main class="page">

  <!-- Decorative city skyline -->
  <img class="skyline" src="contact_image.png" alt="" aria-hidden="true">

  <div class="wrap">
    <header class="intro">
      <h1>Contact Us</h1>
      <p>Have a question or a project in mind? Send us a message and our team will get back to you .</p>
    </header>

    <div class="grid">

      <!-- Contact info -->
      <div class="info">
        <div class="item">
          <div class="icon">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f1c2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          </div>
          <div>
            <h2>Address</h2>
            <p>Plot 03, sinza c, <br>Dar es Salaam, Tanzania</p>
          </div>
        </div>

        <div class="item">
          <div class="icon">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f1c2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
          </div>
          <div>
            <h2>Phone</h2>
            <p>+255 696039787</p>
          </div>
        </div>

        <div class="item">
          <div class="icon">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f1c2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </div>
          <div>
            <h2>Email</h2>
            <p>sabala1367@gmail.com</p>
          </div>
        </div>
      </div>

      <!-- Form card -->
      <section class="card" id="card">
        <h2>Send Message</h2>

        <div class="success" role="status">
          <p class="title">Thank you!</p>
          <p class="text">Your message has been sent. We will reply as soon as we can.</p>
          <button type="button" class="send" id="again">Send another</button>
        </div>

        <form id="form">
          <label class="field"><span class="lbl">Full Name</span>
            <input type="text" name="name" required autocomplete="name">
            <span class="line" aria-hidden="true"></span>
          </label>
          <label class="field"><span class="lbl">Email</span>
            <input type="email" name="email" required autocomplete="email">
            <span class="line" aria-hidden="true"></span>
          </label>
          <label class="field"><span class="lbl">Phone</span>
            <input type="tel" name="phone" autocomplete="tel">
            <span class="line" aria-hidden="true"></span>
          </label>
          <label class="field"><span class="lbl">Type your Message...</span>
            <textarea name="message" rows="3" required></textarea>
            <span class="line" aria-hidden="true"></span>
          </label>

          <p class="err" id="err" role="alert"></p>

          <button type="submit" class="send" id="send" aria-live="polite">
            <span class="spin" aria-hidden="true"></span>
            <span id="send-label">Send</span>
          </button>
        </form>
      </section>

    </div>
  </div>
</main>

<script>
  var card  = document.getElementById('card');
  var form  = document.getElementById('form');
  var send  = document.getElementById('send');
  var label = document.getElementById('send-label');
  var again = document.getElementById('again');
  var errEl = document.getElementById('err');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (send.disabled) return;

    // Loading state
    send.disabled = true;
    send.classList.add('loading');
    label.textContent = 'Sending...';

    errEl.textContent = '';

    var data = new FormData(form);
    var SPIN_MS = 3000;   // spinner inaonekana kwa sekunde ngapi kabla ya kutuma (milliseconds)

    new Promise(function (resolve) { setTimeout(resolve, SPIN_MS); })
      .then(function () { return fetch('dashboard.php?action=contact_send', { method: 'POST', headers: { 'X-Requested-With': 'fetch' }, body: data }); })
      .then(function (r) { return r.json().catch(function () { throw new Error('Server error. Please try again later.'); }); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || 'Your message could not be sent.');
        form.reset();
        card.classList.add('sent');
      })
      .catch(function (er) {
        errEl.textContent = er instanceof TypeError ? 'Could not reach the server. Please check your connection and try again.' : er.message;
      })
      .then(function () {
        send.disabled = false;
        send.classList.remove('loading');
        label.textContent = 'Send';
      });
  });

  again.addEventListener('click', function () {
    card.classList.remove('sent');
  });
</script>
</body>
</html>
